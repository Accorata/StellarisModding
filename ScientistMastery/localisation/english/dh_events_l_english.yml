l_english:
### Events 

  dangerous_horizons.3.name:0 "Scientific Mastery"
  dangerous_horizons.3.desc:0 "..."
  dangerous_horizons.3.a:0 "Wonderful."

# Unstable Singularity (Class-3 Singularity)
  dangerous_horizons.1100.name:0 "Abundant Reactor"
  dangerous_horizons.1100.desc:0 "The §Y[Root.DH_GetSingularity]§! ..."
  dangerous_horizons.1100.a:0 "Investigate the situation."
  dangerous_horizons.1100.b:0 "Shut it down."

  dangerous_horizons.1102.name:0 "Repaired Singularity"
  dangerous_horizons.1102.desc:0 "Investigations into the §Yabnormal energy§! provided by the §Y[Root.DH_GetSingularity]§! on [Root.GetName] have identified the culprit: a §Yweakening containment field§! due to improper routing of power. The waning field was amplifying the effects of the singularity, however it would only hold for so long.\n\nFortunately, our investigations identified the flaw before it could get out of hand. It is unknown what exactly would have happened had we not §Yfixed the containment field§!, but we are sure it would have been bad. We are fortunate to have caught this in time and will be §Ysure to check§! for these types of mistakes in the future."
  dangerous_horizons.1102.a:0 "A good catch."

  dangerous_horizons.1103.name:0 "Unstable Singularity"
  dangerous_horizons.1103.desc:0 "Our §Y[Root.DH_GetSingularity]§! on [Root.GetName] is §Rcollapsing§!! It has become clear that the extra energy it was providing was the result of a faulty containment field, ..."
  dangerous_horizons.1103.a:0 "..."

  dangerous_horizons.1104.name:0 "Kabloom!"
  dangerous_horizons.1104.desc:0 "Our experts established a wide perimter around the unstable singularity, clearing the area of people and explosive equipment. Next, they erected massive durasteel barriers to shield the rest of the planet. Finally they navigated into the core of the singularity via remote drones and strategically released the final containment fields.\n\nAs the calculations predicted, instead of replacing [Root.GetName] with a black hole, the singularity §Yfolded in on itself§! before passing into another dimension. This interdimensional travel resulted in a large explosion which left much debris where previously our infrastructure had stood. Repairs will be long, but manageable."
  dangerous_horizons.1104.a:0 "An unfortunate necessity."
  
  dangerous_horizons.1105.name:0 "Singularity Operational"
  dangerous_horizons.1105.desc:0 "After much hard work by our field manipulation experts, the faulty containment fields of the Singularity on [Root.GetName] have been §Yreparied§!. While there has been much damage done and much repair is necessary, the singularity is §Ystable§! and all predictions show it will remain so. This affair has come to an end.\n\nOur energy specialists will ensure that nothing of this sort happens again."
  dangerous_horizons.1105.a:0 "Wonderful."

  dangerous_horizons.1106.name:0 "Unsuccessful Repairs"
  dangerous_horizons.1106.desc:0 "..."
  dangerous_horizons.1106.a:0 "..."

  dangerous_horizons.1107.name:0 "Unstability Grows"
  dangerous_horizons.1107.desc:0 "As the [Root.DH_GetSingularity] remains unfixed, the last containment fields are stretched to their very limits. Another field has §Rfailed§!, sending gravitic waves throughout [Root.GetName]. The damage is immense, but nothing compared to what will happen if we let the fields completely collapse.\n\nTime is §Rrunning short§!."
  dangerous_horizons.1107.a:0 "Terrible."

  dangerous_horizons.1108.name:0 "Immense Unstability"
  dangerous_horizons.1108.desc:0 "Once again, another containment field has failed, leaving us with §Ronly one§! still operational. ..."
  dangerous_horizons.1108.a:0 "Terrible."

  dangerous_horizons.1109.name:0 "Singularity Collapse"
  dangerous_horizons.1109.desc:0 "We have ran out of time.\n\nThe unstable singularity has been released, pulling [Root.GetName] and the entire solar system into its expanding mass. [Root.System.GetName] is now a §Rblack hole§!, a graveyard of countless souls, an eerie reminder of our failures."
  dangerous_horizons.1109.a:0 "Catastrophic."

  dangerous_horizons.1110.name:0 "[From.Root.System.GetName] System Destroyed!"
  dangerous_horizons.1110.desc:0 "In a terrible series of events, ...\n\nThe final result was the varporization of the entire [From.Root.System.GetName] system. Countless souls lost to hubris."
  dangerous_horizons.1110.a:0 "We will do better."

# Rampaging Invaders (Dimensional Replicator)
  dangerous_horizons.1200.name:0 "Extradimensional Invaders!"
  dangerous_horizons.1200.desc:0 "Our fabricators normally tunnel into dimensional fabric to provide us with an endless stream of resources. Today they ripped beyond that fabric, §Ypuncturing§! another dimension.\n\nThe inhabitants are clearly outraged by this result and §Y[Root.GetName]§! is quickly being §Roverrun§! by extradimensional armies pouring through the tunnelers portal."
  dangerous_horizons.1200.a:0 "Mobilize our forces."
  dangerous_horizons.1200.b:0 "Quick! Close the portal."

  dangerous_horizons.1202.name:0 "Second Breach"
  dangerous_horizons.1202.desc:0 "The invaders have detected another fabricator on §Y[Root.GetName]§! and used it as a second point of attack! Their armies now spill onto both planets with terrifying ferrocity.\n\nThe inhabitants are clearly outraged by this result and §Y[Root.GetName]§! is quickly being §Roverrun§! by extradimensional armies pouring through the tunnelers portal."
  dangerous_horizons.1202.a:0 "Mobilize our forces."
  dangerous_horizons.1202.b:0 "Deactive."

  dangerous_horizons.1204.name:0 "Fabricator Destroyed"
  dangerous_horizons.1204.desc:0 "Soon after our defensive forces on [Root.GetName] fell, the extradimensional invaders launched themselves at the fabricator which had ruptered the space between our worlds. Within moments, critical machinery had been torn asunder, and the rest of fabricator went up in a large explosion.   ..."
  dangerous_horizons.1204.a:0 "Terrible."

  dangerous_horizons.1205.name:0 "[Root.GetName] Overrun"
  dangerous_horizons.1205.desc:0 "Our forces have failed to stop the invaders on [Root.GetName]. ..."
  dangerous_horizons.1205.a:0 "Terrible."

  dangerous_horizons.1206.name:0 "[Root.GetName] Defended"
  dangerous_horizons.1206.desc:0 "Our forces have successfully protected [Root.GetName] from the invaders' attack force. A few stragglers remain and the planet remains on high alert, but they are being hunted down and wiped out. [Root.GetName] will soon be safe.  ..."
  dangerous_horizons.1206.a:0 "Well done."

  dangerous_horizons.1206.name:0 "[Root.GetName] Retaken"
  dangerous_horizons.1206.desc:0 "Our newest battalion has been able to finally repel the extradimensional invaders who attacked [Root.GetName] not that long ago.   ..."
  dangerous_horizons.1206.a:0 "At last."